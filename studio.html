<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/><title>UNIT PRESS Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"/><style>:root{--bg:#08080a;--panel:#121215;--card:#18181d;--line:#2a2a32;--fg:#f3f1ec;--mute:#9c9aa3;--teal:#2EC4B6;--tap:48px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--fg);font-family:Outfit,system-ui,sans-serif;overflow:hidden}body{display:flex;flex-direction:column;min-height:100dvh}header{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0d0d10}header b{letter-spacing:.28em;font-size:12px}.seg{display:flex;background:#0c0c10;border:1px solid var(--line);border-radius:999px;padding:3px}.seg .chip{min-width:76px;min-height:40px;border:0;background:transparent}.seg .chip.on{background:var(--teal);color:#06211e}.wrap{flex:1;display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);min-height:0}aside{border-right:1px solid var(--line);overflow:auto;padding:14px 16px;background:var(--panel)}.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 28%,#1a1a22,var(--bg))}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}.card>summary{list-style:none;cursor:pointer;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;min-height:36px}.card>summary::-webkit-details-marker{display:none}label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:10px 0 6px}input[type=text]{width:100%;background:#0c0c10;border:1px solid var(--line);color:var(--fg);padding:12px;border-radius:8px;font:600 16px Outfit,sans-serif;min-height:var(--tap)}.row{display:flex;gap:8px;flex-wrap:wrap}.chip,.sw,.iconbtn,.tpl{border:1px solid var(--line);background:#0c0c10;color:var(--fg);border-radius:999px;padding:10px 14px;min-height:44px;cursor:pointer;font:600 13px Outfit,sans-serif}.tpl{border-radius:10px;font-size:12px;text-transform:uppercase}.tpl.on{border-color:var(--teal);background:#12332f;color:var(--teal)}.chip.on,.sw.on{border-color:var(--teal)}.sw{width:44px;height:44px;padding:0;border-radius:50%}button.act{background:var(--teal);color:#06211e;border:0;border-radius:10px;padding:12px 14px;font:800 14px Outfit,sans-serif;cursor:pointer;min-height:var(--tap);flex:1}button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:var(--tap);flex:1}.iconbtn{width:44px;height:44px;padding:0;border-radius:10px}.dock{position:sticky;bottom:0;margin-top:16px;padding:12px 0;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px}.shirt{width:min(36rem,92%);position:relative}.shirt img.garment{width:100%;display:block;pointer-events:none}.print{position:absolute;left:50%;width:56%;aspect-ratio:500/620;transform-origin:center;container-type:inline-size}#printSvg{width:100%;height:100%;position:absolute;inset:0;z-index:2;pointer-events:none;overflow:visible}#ring{display:none}.gimg{position:absolute;left:50%;top:38%;width:100%;transform:translate(-50%,-50%);cursor:grab;z-index:1;touch-action:none}.gimg img{width:100%;display:block;pointer-events:none}.line{position:absolute;left:50%;z-index:3;margin:0;width:92%;transform:translateX(-50%);text-align:center;line-height:1;font-weight:700;text-transform:uppercase;pointer-events:none}#ts{width:70%;font-size:4.2cqw;letter-spacing:.22em;padding:.35em .4em}#tm,#tc{font-size:4.8cqw;letter-spacing:.12em}.star,#star{position:absolute;left:50%;width:12px;height:12px;max-width:12px;max-height:12px;transform:translateX(-50%);z-index:3;display:none!important;visibility:hidden;pointer-events:none}#handle{position:absolute;right:-10px;bottom:-10px;width:28px;height:28px;background:#2EC4B6;border:2px solid #06211e;border-radius:6px;cursor:nwse-resize;z-index:4}.hint{font-size:12px;color:var(--mute)}.cap{margin-top:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6d6b74;text-align:center}.scale-row{display:flex;align-items:center;gap:8px}.scale-row input{flex:1}.col{display:flex;flex-direction:column;align-items:center}.swatch-name{font-size:10px;color:var(--mute);text-transform:capitalize;margin-top:4px}@media(max-width:899px){.wrap{grid-template-columns:1fr;grid-template-rows:minmax(200px,42dvh) minmax(0,1fr)}aside{order:2;border-right:0;border-top:1px solid var(--line)}.stage{order:1;padding:6px 8px}.shirt{width:fit-content;max-width:72vw;height:calc(42dvh - 24px);margin:0 auto}.shirt img.garment{width:auto;height:100%;max-width:72vw}.dock{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 14px}}</style></head><body><header><b>UNIT PRESS</b><div class="seg"><button class="chip on" id="frontBtn" type="button">Front</button><button class="chip" id="backBtn" type="button">Back</button></div></header><div class="wrap"><aside><details class="card" open><summary>Templates</summary><div class="row" id="tpls"></div><p class="hint">Pick a design, then edit any text or replace the graphic.</p></details><details class="card" open><summary>Text</summary><label for="h">Heading</label><input id="h" type="text" maxlength="24" value="ICU"/><label for="s">Subheading</label><input id="s" type="text" maxlength="40" value="INTENSIVE CARE UNIT"/><label for="m">Line 3</label><input id="m" type="text" maxlength="40" value="STAY CALM. INTERVENE."/><label for="c">Line 4</label><input id="c" type="text" maxlength="40" value="SAVE LIVES."/></details><details class="card" open><summary>Style</summary><label>Palette</label><div class="row" id="pals"></div><label>Layout</label><div class="row" id="lays"></div><label>Shirt color</label><div class="row" id="cols"></div></details><details class="card" open><summary>Graphic</summary><div class="row" style="margin-top:8px"><button class="ghost" type="button" id="plus">Replace +</button><button class="ghost" type="button" id="delg">Delete</button><input id="file" type="file" accept="image/png,image/jpeg,image/svg+xml" hidden/></div><label>Size</label><div class="scale-row"><button class="iconbtn" type="button" id="gsMinus">-</button><input id="gscale" type="range" min="20" max="240" value="100"/><button class="iconbtn" type="button" id="gsPlus">+</button><span id="gscaleVal">100%</span></div></details><div class="dock"><button class="act" type="button" id="exp">Export PNG</button><button class="ghost" type="button" id="reset">Reset</button></div></aside><div class="stage"><div class="shirt" id="shirt"><img class="garment" id="garment" alt="T-shirt mockup" draggable="false" crossorigin="anonymous"/><div class="print" id="print"><div class="gimg" id="gbox"><img id="gimg" alt="print graphic" src="icu-sunset.png" crossorigin="anonymous"/><div id="handle"></div></div><svg viewBox="0 0 500 620" id="printSvg" aria-hidden="true"><defs><path id="tomb" d="M 28 132 Q 250 6 472 132"/><path id="ctop" d="M 76 272 A 174 174 0 0 1 424 272"/><path id="cbot" d="M 76 272 A 174 174 0 0 0 424 272"/></defs><circle id="ring" cx="250" cy="272" r="188" fill="none" stroke="#F3EBDD" stroke-width="10"/><text id="ath"></text><text id="atc"></text></svg><p class="line" id="th">ICU</p><p class="line" id="ts">INTENSIVE CARE UNIT</p><p class="line" id="tm">STAY CALM. INTERVENE.</p><p class="line" id="tc">SAVE LIVES.</p></div></div><p class="cap" id="cap">Front print</p></div></div><script>const CDN="";const P={retro:{p:'#2EC4B6',s:'#F24E8A',c:'#F24E8A',o:'#F24E8A',out:1,f:'Bebas Neue'},monotone:{p:'#E8D5B7',s:'#E8D5B7',c:'#E8D5B7',o:'#E8D5B7',out:0,f:'Oswald'},modern:{p:'#F4F0E8',s:'#2EC4B6',c:'#F4F0E8',o:'#F4F0E8',out:0,f:'Outfit'},classic:{p:'#2EC4B6',s:'#F24E8A',c:'#2EC4B6',o:'#0A0A0A',out:1,f:'Anton'}};const SH={black:{hex:'#0c0c0e',photo:'black'},white:{hex:'#f4f0e8',photo:'white'},navy:{hex:'#1a2744',photo:'navy'},red:{hex:'#c62828',photo:null},royal:{hex:'#1565c0',photo:null},green:{hex:'#2e7d32',photo:null},purple:{hex:'#6a1b9a',photo:null},charcoal:{hex:'#3a3a42',photo:null},forest:{hex:'#1c3d32',photo:null},maroon:{hex:'#6a2436',photo:null},teal:{hex:'#165e5a',photo:null},hot:{hex:'#c9366e',photo:null},bone:{hex:'#e6d7c3',photo:null}};const TPL={icu:{label:'ICU',pal:'retro',lay:'stacked',shirt:'black',h:'ICU',s:'INTENSIVE CARE UNIT',m:'STAY CALM. INTERVENE.',c:'SAVE LIVES.',src:'icu-sunset.png',gx:50,gy:38,gs:1,showG:true},cardiac:{label:'Cardiac',pal:'monotone',lay:'stacked',shirt:'red',h:'',s:'',m:'CARDIAC',c:'',src:'graphics/cardiac.svg',gx:50,gy:36,gs:1.05,showG:true},hf:{label:'Heart Failure',pal:'modern',lay:'stacked',shirt:'royal',h:'',s:'',m:'HEART',c:'FAILURE',src:'graphics/heart-failure.svg',gx:50,gy:34,gs:1.08,showG:true},code:{label:'Code Team',pal:'monotone',lay:'circle',shirt:'green',h:'CODE',s:'',m:'',c:'TEAM',src:'graphics/code-team.svg',gx:50,gy:44,gs:.72,showG:true},stroke:{label:'Stroke',pal:'monotone',lay:'circle',shirt:'purple',h:'STROKE',s:'',m:'',c:'STROKE',src:'graphics/stroke.svg',gx:50,gy:44,gs:.72,showG:true}};const TOPS={stacked:{h:1.4,s:16.6,m:76.6,c:83.2},tombstone:{h:0,s:22.2,m:77.2,c:83.8},circle:{h:0,s:43.5,m:81.2,c:0}};const GPOS={stacked:{x:50,y:38,s:1},tombstone:{x:50,y:48,s:.88},circle:{x:50,y:44,s:.7}};const st={tpl:'icu',pal:'retro',lay:'stacked',shirt:'black',side:'front',gx:50,gy:38,gs:1,showG:true,src:'icu-sunset.png'};const $=id=>document.getElementById(id);const cache=new Map();function photoUrl(name,side){return (CDN||'')+'shirts/'+name+(side==='back'?'-back':'')+'.jpg'}function asset(path){if(!path)return '';if(/^(data:|blob:|http)/.test(path))return path;return (CDN||'')+path}function applyTemplate(id){const tp=TPL[id];if(!tp)return;st.tpl=id;st.pal=tp.pal;st.lay=tp.lay;st.shirt=tp.shirt;st.gx=tp.gx;st.gy=tp.gy;st.gs=tp.gs;st.showG=tp.showG;st.src=asset(tp.src);$('h').value=tp.h;$('s').value=tp.s;$('m').value=tp.m;$('c').value=tp.c;paint()}function isLight(hex){const c=hex.slice(1);const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return (0.2126*r+0.7152*g+0.0722*b)/255>0.62}function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>rej(new Error(src));im.src=src})}async function recolor(hex,side){const key=hex+side;if(cache.has(key))return cache.get(key);const light=isLight(hex);const img=await loadImg(photoUrl(light?'white':'black',side));const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);const data=ctx.getImageData(0,0,canvas.width,canvas.height);const d=data.data;const tr=parseInt(hex.slice(1,3),16),tg=parseInt(hex.slice(3,5),16),tb=parseInt(hex.slice(5,7),16);const thresh=light?0.06:0.018;for(let i=0;i<d.length;i+=4){const lum=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;if(lum<thresh)continue;const f=light?lum/0.86:lum/0.16;d[i]=Math.max(0,Math.min(255,tr*f));d[i+1]=Math.max(0,Math.min(255,tg*f));d[i+2]=Math.max(0,Math.min(255,tb*f))}ctx.putImageData(data,0,0);const url=canvas.toDataURL('image/jpeg',0.92);cache.set(key,url);return url}function mkChips(el,items,key,fmt){el.innerHTML='';items.forEach(id=>{const b=document.createElement('button');b.type='button';b.className='chip'+(st[key]===id?' on':'');b.textContent=fmt?fmt(id):id;b.onclick=()=>{st[key]=id;if(key==='lay'&&st.showG){const g=GPOS[id];st.gx=g.x;st.gy=g.y;st.gs=g.s}paint()};el.appendChild(b)})}function hSize(t){const n=t.trim().length;return n<=3?22:n<=4?18:n<=6?14:n<=9?11:8}function pathText(el,href,t,fill,size,font,strokeCol,on){while(el.firstChild)el.removeChild(el.firstChild);el.setAttribute('fill',fill);el.style.fontFamily=font+',sans-serif';el.style.fontSize=size+'px';el.style.letterSpacing='4px';el.style.textTransform='uppercase';el.setAttribute('font-weight','700');if(on){el.setAttribute('stroke',strokeCol);el.setAttribute('stroke-width',size>50?'7':'6');el.setAttribute('paint-order','stroke fill')}const tp=document.createElementNS('http://www.w3.org/2000/svg','textPath');tp.setAttribute('href',href);tp.setAttribute('startOffset','50%');tp.setAttribute('text-anchor','middle');tp.textContent=t.toUpperCase();el.appendChild(tp)}function setGarment(){const info=SH[st.shirt];const g=$('garment');if(info.photo){g.src=photoUrl(info.photo,st.side);return}recolor(info.hex,st.side).then(url=>g.src=url).catch(()=>g.src=photoUrl('black',st.side))}function paint(){const pal=P[st.pal];const h=$('h').value,s=$('s').value,m=$('m').value,c=$('c').value;const tpls=$('tpls');tpls.innerHTML='';Object.entries(TPL).forEach(([id,tp])=>{const b=document.createElement('button');b.type='button';b.className='tpl'+(st.tpl===id?' on':'');b.textContent=tp.label;b.onclick=()=>applyTemplate(id);tpls.appendChild(b)});mkChips($('pals'),Object.keys(P),'pal',id=>id[0].toUpperCase()+id.slice(1));mkChips($('lays'),['stacked','tombstone','circle'],'lay',id=>id[0].toUpperCase()+id.slice(1));const cols=$('cols');cols.innerHTML='';Object.entries(SH).forEach(([id,info])=>{const wrap=document.createElement('div');wrap.className='col';const b=document.createElement('button');b.type='button';b.className='sw'+(st.shirt===id?' on':'');b.style.background=info.hex;b.title=id;b.onclick=()=>{st.shirt=id;paint()};const n=document.createElement('span');n.className='swatch-name';n.textContent=id;wrap.appendChild(b);wrap.appendChild(n);cols.appendChild(wrap)});if($('gscale')){$('gscale').value=Math.round(st.gs*100);$('gscaleVal').textContent=Math.round(st.gs*100)+'%'} $('frontBtn').className='chip'+(st.side==='front'?' on':'');$('backBtn').className='chip'+(st.side==='back'?' on':'');setGarment();const print=$('print');print.style.left='50%';print.style.top=(st.side==='back'?38:39)+'%';print.style.transform='translate(-50%,-50%) scale('+(st.side==='back'?1:1.05)+')';const tops=TOPS[st.lay];const stacked=st.lay==='stacked';const showSub=s.trim()&&(st.lay!=='stacked'||!st.showG||s.trim().toUpperCase()!=='INTENSIVE CARE UNIT');const th=$('th'),ts=$('ts'),tm=$('tm'),tc=$('tc');th.textContent=h;th.style.fontFamily=pal.f+',sans-serif';th.style.color=pal.p;th.style.fontSize=hSize(h)+'cqw';th.style.top=tops.h+'%';th.style.webkitTextStroke=pal.out?(Math.max(2,hSize(h)*0.045)+'cqw '+pal.o):'0';th.style.display=stacked&&h.trim()?'block':'none';ts.textContent=s;ts.style.fontFamily=pal.f+',sans-serif';ts.style.color=pal.p;ts.style.top=tops.s+'%';ts.style.background=showSub?'rgba(8,8,10,.9)':'transparent';ts.style.display=showSub?'block':'none';tm.textContent=m;tm.style.fontFamily=pal.f+',sans-serif';tm.style.color=pal.p;tm.style.top=tops.m+'%';tm.style.display=m.trim()?'block':'none';tc.textContent=c;tc.style.fontFamily=pal.f+',sans-serif';tc.style.color=pal.c;tc.style.top=tops.c+'%';tc.style.display=(st.lay!=='circle'&&c.trim())?'block':'none';const ring=$('ring');if(ring){ring.style.display=st.lay==='circle'?'block':'none';ring.setAttribute('stroke',pal.p)}const ath=$('ath'),atc=$('atc');if(st.lay==='tombstone'){pathText(ath,'#tomb',h,pal.p,h.trim().length<=4?92:56,pal.f,pal.o,pal.out);while(atc.firstChild)atc.removeChild(atc.firstChild)}else if(st.lay==='circle'){pathText(ath,'#ctop',h,pal.p,h.trim().length<=4?64:42,pal.f,pal.o,pal.out);pathText(atc,'#cbot',c,pal.c||pal.p,28,pal.f,pal.o,0)}else{while(ath.firstChild)ath.removeChild(ath.firstChild);while(atc.firstChild)atc.removeChild(atc.firstChild)}const box=$('gbox');box.style.display=st.showG?'block':'none';box.style.left=st.gx+'%';box.style.top=st.gy+'%';box.style.transform='translate(-50%,-50%) scale('+st.gs+')';$('gimg').src=st.src;$('cap').textContent=(st.side==='back'?'Back print':'Front print')+' · edit text or replace graphic'}['h','s','m','c'].forEach(id=>$(id).addEventListener('input',paint));$('frontBtn').onclick=()=>{st.side='front';paint()};$('backBtn').onclick=()=>{st.side='back';paint()};$('plus').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{st.src=r.result;st.showG=true;paint()};r.readAsDataURL(f)};$('delg').onclick=()=>{st.showG=false;paint()};$('reset').onclick=()=>{st.side='front';applyTemplate(st.tpl||'icu')};function clampScale(v){return Math.max(0.2,Math.min(2.4,v))}$('gscale').addEventListener('input',e=>{st.gs=clampScale((+e.target.value)/100);paint()});$('gsMinus').onclick=()=>{st.gs=clampScale(st.gs-0.08);paint()};$('gsPlus').onclick=()=>{st.gs=clampScale(st.gs+0.08);paint()};let drag=null,pinch=null,pts=new Map();function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}$('gbox').addEventListener('pointerdown',e=>{try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:dist(a,b),s:st.gs};drag=null}else if(e.target.id==='handle'){drag={k:'s',x:e.clientX,y:e.clientY,s:st.gs}}else{drag={k:'m',x:e.clientX,y:e.clientY,gx:st.gx,gy:st.gy}}e.preventDefault()});window.addEventListener('pointermove',e=>{if(pts.has(e.pointerId))pts.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});if(pinch&&pts.size>=2){const[a,b]=[...pts.values()];st.gs=clampScale(pinch.s*(dist(a,b)/pinch.d));paint();return}if(!drag)return;const r=$('print').getBoundingClientRect();if(drag.k==='s')st.gs=clampScale(drag.s+(e.clientX-drag.x+e.clientY-drag.y)/180);else{st.gx=Math.max(8,Math.min(92,drag.gx+(e.clientX-drag.x)/r.width*100));st.gy=Math.max(8,Math.min(92,drag.gy+(e.clientY-drag.y)/r.height*100))}paint()});function endPtr(e){pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)drag=null}window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',endPtr);$('exp').onclick=async()=>{const gimg=$('garment');await gimg.decode().catch(()=>{});const canvas=document.createElement('canvas');canvas.width=gimg.naturalWidth||1200;canvas.height=gimg.naturalHeight||1600;const ctx=canvas.getContext('2d');ctx.drawImage(gimg,0,0,canvas.width,canvas.height);const W=canvas.width,H=canvas.height;const sc=st.side==='back'?1:1.05;const oy=st.side==='back'?0.38:0.39;const pw=W*0.56*sc,ph=pw*(620/500);const px=W*0.50-pw/2,py=H*oy-ph/2;if(st.showG){const g=new Image();g.crossOrigin='anonymous';g.src=st.src;try{await g.decode();const gw=pw*st.gs,gh=gw/(g.naturalWidth/g.naturalHeight||1.26);ctx.save();ctx.translate(px+pw*(st.gx/100),py+ph*(st.gy/100));ctx.drawImage(g,-gw/2,-gh/2,gw,gh);ctx.restore()}catch(e){}}const pal=P[st.pal];ctx.textAlign='center';ctx.textBaseline='top';const font=pal.f;function drawLine(text,yPct,sizeCqw,color,strokeOn){if(!text.trim())return;const size=pw*(sizeCqw/100);ctx.font='700 '+size+'px '+font+',sans-serif';ctx.fillStyle=color;if(strokeOn){ctx.lineWidth=Math.max(2,size*0.045);ctx.strokeStyle=pal.o;ctx.strokeText(text.toUpperCase(),px+pw/2,py+ph*(yPct/100))}ctx.fillText(text.toUpperCase(),px+pw/2,py+ph*(yPct/100))}const tops=TOPS[st.lay];if(st.lay==='stacked')drawLine($('h').value,tops.h,hSize($('h').value),pal.p,pal.out);const s=$('s').value;if(s.trim()&&(st.lay!=='stacked'||!st.showG||s.trim().toUpperCase()!=='INTENSIVE CARE UNIT'))drawLine(s,tops.s,4.2,pal.p,0);drawLine($('m').value,tops.m,4.8,pal.p,0);if(st.lay!=='circle')drawLine($('c').value,tops.c,4.8,pal.c,0);const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='unit-press.png';a.click()};try{window.parent.postMessage({type:'unit-press-ready'},'*')}catch(e){}const q=new URLSearchParams(location.search).get('tpl');if(q&&TPL[q])applyTemplate(q);else paint();</script></body></html>
